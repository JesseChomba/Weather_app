<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="weather-refresh.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/skycons/1396634940/skycons.js"></script>
</head>
<body>
    <div class="container">
        <h1>Weather App 🌤️</h1>
        <label class="theme-switch">
            <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
            <span class="slider">
                <i class="fas fa-sun"></i>
                <i class="fas fa-moon"></i>
            </span>
        </label>
        <p>Enter a city name to get the current weather:</p>
        <div class="input-group">
            <input type="text" id="city" placeholder="Enter City Name" required aria-label="Enter city name for weather" />
            <button onclick="getWeather()">Get Weather</button>
            <button onclick="getLocation()">Use My Location</button>
        </div>
        <label>
            <input type="checkbox" id="unitToggle" onchange="toggleUnit()" />
            Show °F
        </label>
        <div id="recentSearches"></div>
        <div id="weatherInfo"></div>
        <div id="forecast"></div>
    </div>
    <script src="weather-refresh.js"></script>
    <!-- Add Vercel Analytics -->
    <script>
        // Load Vercel Analytics script dynamically
        (function() {
            const script = document.createElement("script");
            script.src = "https://va.vercel-scripts.com/v1/script.debug.js";
            script.defer = true;
            script.onload = () => {
                console.log("Vercel Analytics loaded");
            };
            document.head.appendChild(script);
        })();
    </script>
</body>
</html>
